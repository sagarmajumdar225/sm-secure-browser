name: Release & Verification Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Audit Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Privacy & Anti-Tracking Audit
        run: |
          echo "Scanning codebase for prohibited tracking/analytics SDKs..."
          if grep -riE "firebase|analytics|crashlytics|sentry|glean|installreferrer" app/src/; then
            echo "ERROR: Forbidden analytics or tracking reference found in app/src!"
            exit 1
          else
            echo "SUCCESS: Zero tracking/analytics SDK references detected."
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Ensure Debug Keystore Exists for Fallback Signing
        run: |
          mkdir -p ~/.android
          mkdir -p ~/.config/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-secure-browser-release
          path: app/build/outputs/apk/release/*.apk
